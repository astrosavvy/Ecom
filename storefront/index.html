<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>YOUNOYA — The Magical Gift Store · A Scroll-Through Night World</title>
  <meta name="description" content="Scroll to fly through Younoya — a neon-night miniature gift store where a robot-ninja guide reads your intention and walks the shelves. Premium gifting meets astrology." />
  <link rel="icon" type="image/png" href="assets/younoya-logo.png" />
  <meta property="og:title" content="YOUNOYA — The Magical Gift Store" />
  <meta property="og:description" content="One unbroken scroll-driven flight through a neon-night miniature gift store, guided by a robot-ninja." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Theme the lets-scroll engine here. Unlayered :root wins over the engine's
       @layer defaults (see scrub-engine.js gotchas) — dark theme swap. */
    :root, .sw-root {
      /* Must equal the scene background locked in every render prompt (#0B0E18)
         so posters sit seamlessly inside the page. */
      --sw-bg: #0B0E18;
      --sw-ink: #F5EDE0;
      --sw-ink-soft: #A79FB3;
      --sw-accent: #D4AF37;
      --sw-font-display: 'Instrument Serif', Georgia, serif;
      --sw-font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    html { background: #0B0E18; }

    /* Real logo in the engine's fixed brand bar (unlayered CSS wins over the
       engine's @layer defaults). The mark span becomes the PNG wordmark; the
       text name is hidden since the PNG already contains it. */
    .sw-brand__mark {
      width: 69px;
      height: 40px;               /* transparent-PNG lockup, aspect 1.723 */
      background: url('assets/younoya-logo.png') left center / contain no-repeat;
      box-shadow: none;
      border-radius: 0;
    }
    .sw-brand__name { display: none; }

    /* Header tagline — e-commerce style */
    .sw-topbar::after {
      content: "Younoya — Astrology Recommendation Engine for Gifting";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sw-ink-soft);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

<script src="scrub-engine.js"></script>
  <script>
    // Prevent browser from restoring scroll position on reload
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);

    mountLetsScroll(document.getElementById('world'), {
      brand: { name: 'YOUNOYA', href: '#top' },
      cta: { label: 'Shop Consecrated Rakhis', href: '#reveal' },
      hint: 'scroll to enter the store',
      diveScroll: 1.35,
      connScroll: 0.95,

      // ── The journey (N=6, Architecture B: dive-in + aerial connectors) ──
      sections: [
        {
          id: 'threshold', label: 'Shop',
          still: 'assets/threshold.webp',
          clip: 'assets/vid/threshold.mp4',
          accent: '#D4AF37',
          scroll: 1.5, linger: 0.45,
          eyebrow: 'Younoya — Astrology Recommendation Engine for Gifting',
          title: 'The store that finds you first.',
          body: 'Scroll to fly through a neon-night miniature gift store where a robot-ninja guide reads your intention and walks the shelves for you.',
          tags: ['Robot-ninja guide', 'One unbroken flight', 'Consecrated Rakhis'],
        },
        {
          id: 'intent', label: 'Astrology',
          still: 'assets/intent.webp',
          clip: 'assets/vid/intent.mp4',
          accent: '#E8A0BF',
          scroll: 1.4, linger: 0.5,
          eyebrow: 'Choose your intention',
          title: 'Four altars, one wish.',
          body: 'Love, prosperity, momentum or calm — whichever altar glows back decides how every shelf rearranges.',
          tags: ['Rose quartz', 'Temple gold', 'Jade & moonstone'],
        },
        {
          id: 'cosmos', label: 'Your Chart',
          still: 'assets/cosmos.webp',
          clip: 'assets/vid/cosmos.mp4',
          accent: '#9BB5D6',
          scroll: 1.35, linger: 0.4,
          eyebrow: 'The astrology engine',
          title: 'Your chart, read in lamplight.',
          body: 'A tiny priest-bot turns the nakshatra wheel and weighs your birth-sky against the wish you carried in.',
          tags: ['27 lunar mansions', 'Simulated · stored nowhere'],
        },
        {
          id: 'seek', label: 'Discovery',
          still: 'assets/seek.webp',
          clip: 'assets/vid/seek.mp4',
          accent: '#34D399',
          scroll: 1.5, linger: 0.5,
          eyebrow: 'Toshi goes looking',
          title: 'He leaps, he scans, he listens.',
          body: 'Between glowing keepsake boxes the guide lifts each candidate and keeps only what stays warm for seven seconds.',
          tags: ['Magnetic shelves', 'Weight-tested', 'Curated to three'],
        },
        {
          id: 'reveal', label: 'Curated Gifts',
          still: 'assets/reveal.webp',
          clip: 'assets/vid/reveal.mp4',
          accent: '#F59E0B',
          scroll: 1.7, linger: 0.55,
          eyebrow: 'The chosen three',
          title: 'Only what answers to you.',
          body: 'Each keepsake arrives with its symbolism, its ritual, and the reason your chart called it here.',
          tags: ['Symbolism included', 'Consecration noted', 'Gift-ready'],
        },
        {
          id: 'companion', label: 'Our Story',
          still: 'assets/companion.webp',
          clip: 'assets/vid/companion.mp4',
          accent: '#D4AF37',
          scroll: 1.4, linger: 0.5,
          eyebrow: 'For every chapter',
          title: 'Come back when the season turns.',
          body: 'Intentions evolve and the store re-arranges itself around the new north — Toshi will be on the roof, dozing.',
          tags: ['Retune anytime', 'One email per moon'],
          cta: {
            primary: { label: 'Begin your chapter', href: '#top' },
            secondary: { label: 'Write to the sanctuary', href: 'mailto:support@younoya.com' },
          },
        },
      ],

      // Aerial hops restored — connectors watermark-stripped + color-matched to
      // their neighbouring dives (fix_videos.py). If the mid-flight buildings
      // still feel off, re-roll conn_*.mp4 with the SAME tool/session as dives.
      connectors: [
        'assets/vid/conn1.mp4',
        'assets/vid/conn2.mp4',
        'assets/vid/conn3.mp4',
        'assets/vid/conn4.mp4',
        'assets/vid/conn5.mp4',
      ],
      // Native 9:16 portrait chain (mobile opt-in) — pending renders. Phones
      // currently fall back to the desktop clips above (engine hardening stays on).
      connectorsMobile: [],
    });
  </script>
</body>
</html>
