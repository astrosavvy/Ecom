version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: younoya_backend
    restart: always
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "9000:9000"
    networks:
      - younoya_network

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    container_name: younoya_storefront
    restart: always
    env_file: ./storefront/.env.production
    depends_on:
      - backend
    ports:
      - "8000:8000"
    networks:
      - younoya_network

  postgres:
    image: postgres:15-alpine
    container_name: younoya_db
    restart: always
    environment:
      POSTGRES_DB: younoya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_prod_pass_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - younoya_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d younoya"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: younoya_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - younoya_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: younoya_mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - younoya_network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: younoya_tunnel
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiOGExNzgxNWYwNDg4NzM3MDJlODUyMTUzZTg0ZjZmNTYiLCJ0IjoiNmQ3NzUxOWItMDA1ZC00YmU5LWJmMGYtMzBiYTlkMjliZDNiIiwicyI6Ik5EY3dPV016TTJJdE5EUTFOQzAwTldZNExXRXdNall0TWpBNVpERmlNRGN5WmpReiJ9
    networks:
      - younoya_network
    depends_on:
      - backend
      - storefront

volumes:
  pgdata:
  redisdata:

networks:
  younoya_network:
    driver: bridge
