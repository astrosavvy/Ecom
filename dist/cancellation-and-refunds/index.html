    <div id="root"></div><noscript><main><h1>Cancellation and Refunds</h1><p>Draft information. Online ordering is being prepared.</p><section><h2>Before dispatch</h2><p>Request cancellation from your order page or contact support before dispatch. The atelier checks courier status before approval. A submitted request does not itself cancel an order.</p></section><section><h2>Damaged, defective or incorrect pieces</h2><p>We accept requests concerning damaged, defective or incorrect items. The reporting timeframe will be published before ordering opens. Statutory consumer rights remain unaffected.</p></section><section><h2>Returns and review</h2><p>Change-of-mind returns are not offered. Wait for approval and return instructions before sending an item. We review the reported issue and, where applicable, returned items before approving a refund or other resolution.</p></section><section><h2>Refunds</h2><p>The refund initiation timeframe will be published before ordering opens. Approved refunds use the original payment method, with separate bank/provider processing time.</p></section><section><h2>Support and rights</h2><p>For assistance, write to support@younoya.com. Include your order number for order enquiries. Grievance contact details are being finalized before online ordering opens.</p></section><a href="mailto:support@younoya.com">Contact support</a></main></noscript>
