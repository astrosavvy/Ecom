    <div id="root"></div><noscript><main><h1>Shipping Policy</h1><p>Published policy</p><section><h2>Delivery within India</h2><p>We offer free shipping to serviceable addresses in India. Availability is checked against your PIN code and selection before payment.</p></section><section><h2>Dispatch and arrival</h2><p>Dispatch is within 24 hours of payment confirmation. Estimated delivery is 3–5 working days after dispatch. Remote areas, courier disruptions and circumstances beyond our control may cause delays. Estimates are not guaranteed arrival dates.</p></section><section><h2>Following your order</h2><p>Payment confirmation means your order has been received. It does not mean the parcel has dispatched. Your order page shows courier pickup, tracking and delivery updates when available.</p></section><section><h2>Delivery assistance</h2><p>Please enter a complete address and reachable mobile number. Contact us promptly about an incorrect address, delay or delivery issue. For assistance, write to support@younoya.com. Include your order number for order enquiries.</p></section><a href="mailto:support@younoya.com">Contact support</a></main></noscript>
