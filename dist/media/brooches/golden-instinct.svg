<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A1124"/>
      <stop offset="60%" stop-color="#0E0A14"/>
      <stop offset="100%" stop-color="#05070C"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D6B06A"/>
      <stop offset="100%" stop-color="#9E7D3B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Celestial Grid -->
  <circle cx="400" cy="360" r="280" fill="none" stroke="#D6B06A" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="400" cy="360" r="210" fill="none" stroke="#D6B06A" stroke-opacity="0.25" stroke-dasharray="4 8" stroke-width="1.5"/>
  <circle cx="400" cy="360" r="140" fill="none" stroke="#D6B06A" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Radial Rays -->
  <line x1="400" y1="80" x2="400" y2="640" stroke="#D6B06A" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="120" y1="360" x2="680" y2="360" stroke="#D6B06A" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Ambient Aura Pool -->
  <circle cx="400" cy="360" r="110" fill="#3F3F46" opacity="0.15" filter="url(#glow)"/>

  <!-- Central Brooch Motif Vector -->
  <g transform="translate(0, 0)">
    <path d="M350 460 C310 460 290 410 310 360 C330 310 380 280 430 260 C440 310 410 370 440 430 C410 450 380 460 350 460 Z" fill="#27272A" stroke="url(#goldGrad)" stroke-width="5"/>
            <circle cx="435" cy="385" r="14" fill="#F59E0B" filter="url(#glow)"/>
            <circle cx="370" cy="330" r="5" fill="#D6B06A"/>
  </g>

  <!-- Cardinal Star Marks -->
  <text x="400" y="145" text-anchor="middle" fill="#D6B06A" font-size="14" opacity="0.6">✦</text>
  <text x="400" y="585" text-anchor="middle" fill="#D6B06A" font-size="14" opacity="0.6">✦</text>
  <text x="180" y="365" text-anchor="middle" fill="#D6B06A" font-size="14" opacity="0.6">✦</text>
  <text x="620" y="365" text-anchor="middle" fill="#D6B06A" font-size="14" opacity="0.6">✦</text>

  <!-- Brand Overline & Motif Label -->
  <text x="400" y="660" text-anchor="middle" fill="#D6B06A" font-family="'Cinzel', Georgia, serif" font-size="13" letter-spacing="4" font-weight="600">YOUNOYA CONSECRATED HEIRLOOM</text>
  <text x="400" y="695" text-anchor="middle" fill="#FAF6EE" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" font-weight="400">GOLDEN INSTINCT</text>
  <text x="400" y="730" text-anchor="middle" fill="#9CA3AF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="1.5">Black Metal Squirrel • 2.70 × 1.80 in • 27.65 g</text>
</svg>