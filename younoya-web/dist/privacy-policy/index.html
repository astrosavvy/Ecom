    <div id="root"></div><noscript><main><h1>Privacy Policy</h1><p>Published policy</p><section><h2>Who handles your information</h2><p>YOUNOYA HOUSE OF ASTRO PRIVATE LIMITED operates Younoya. Business address: B-86 basement, DTDC, South Delhi, Delhi 110024. For assistance, write to support@younoya.com. Include your order number for order enquiries.</p></section><section><h2>Information you provide</h2><p>We process contact and login details, delivery addresses, order information, saved selections, support requests and optional gift-guide answers. Birth date, birth time and birthplace are optional and used for the astrological guidance you request.</p></section><section><h2>How we use it</h2><p>We use information to verify access, curate requested guidance, save recommendations, fulfil orders, provide support, prevent fraud and meet record-keeping obligations. Essential browser storage maintains login, bag, selected gifts and pending payment recovery.</p></section><section><h2>Service providers</h2><p>Razorpay processes payments and Shiprocket coordinates shipping when ordering is enabled. Email/message delivery providers handle verification and order communications. Requested guidance may use OpenCage, VedAstro and OpenRouter for location, astrology and wording. These services receive information needed for their role and may process it outside India. The storefront does not store full card details or payment credentials.</p></section><section><h2>Retention and requests</h2><p>We retain information needed for active services, support and applicable business/legal records. Email support to request access, correction or deletion; identity verification and legal retention obligations may apply. Optional guidance is not a guarantee of outcomes or medical, legal or financial advice.</p></section><section><h2>Grievances and changes</h2><p>Grievance contact: Savvy Singh, support@younoya.com, +91 9953312457. We acknowledge consumer grievances within 48 hours and aim to resolve them within one month. Changes are published with a policy revision; checkout records the revision accepted for your order.</p></section><a href="mailto:support@younoya.com">Contact support</a></main></noscript>
