name: Deploy Unified Cloudflare Worker & VPS Backend

on:
  push:
    branches:
      - main

jobs:
  deploy-cloudflare:
    name: Build & Deploy Unified Next.js Storefront to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install Storefront Dependencies
        working-directory: storefront
        run: npm ci

      - name: Build Next.js & OpenNext Cloudflare Bundle
        working-directory: storefront
        run: |
          npx @opennextjs/cloudflare
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL || 'http://140.245.7.165' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_TNGgxOeUADZzEF' }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'storefront'
          command: deploy

  deploy-vps:
    name: Sync VPS Backend Config & Reload
    runs-on: ubuntu-latest
    needs: deploy-cloudflare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Backend Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 140.245.7.165
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/public/*,backend/routes/*,backend/app/*"
          target: "/var/www/younoya/"

      - name: Reload PHP-FPM & Nginx on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 140.245.7.165
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            sudo systemctl reload nginx
            sudo systemctl restart php*-fpm
