name: Deploy YOUNOYA Stack to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Create Remote Directory
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /home/ubuntu/younoya"

      - name: Archive and Copy Files to VPS
        run: |
          tar --exclude='backend/node_modules' --exclude='backend/.medusa' --exclude='storefront/node_modules' --exclude='storefront/.next' -czf deploy.tar.gz backend storefront docker-compose.prod.yml
          scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/younoya/

      - name: Execute Remote Deployment Script
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /home/ubuntu/younoya && \
            tar -xzf deploy.tar.gz && \
            rm deploy.tar.gz && \
            docker compose -f docker-compose.prod.yml up -d --build
          "
